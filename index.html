<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Readiness-Tool (Prototyp)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <div class="app-header-title">
    <h1>Readiness-Tool</h1>
    <p class="subtitle">Prototyp — läuft vollständig lokal im Browser, keine Daten verlassen dieses Gerät</p>
  </div>
  <div class="app-header-actions">
    <button id="export-btn" class="btn btn-secondary">Export (JSON)</button>
    <button id="import-btn" class="btn btn-secondary">Import (JSON)</button>
    <input type="file" id="import-input" accept="application/json" hidden />
    <button id="reset-btn" class="btn btn-danger">Zurücksetzen</button>
  </div>
</header>

<nav id="step-nav" class="step-nav"></nav>

<main id="step-content" class="step-content"></main>

<footer class="app-footer">
  <p>Prototyp zur Diskussion — Datenmodell und Bewertungslogik entsprechen dem Excel/VBA-Original (Fragenkatalog, Relevanzmatrix, 0–4 Bewertungsskala); die Umsetzung ist neu.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/relevance.js"></script>
<script src="js/state.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
